# @GenAI-START - Generated by Cursor on 2026-09-13
spring:
  application:
    name: jackpot-service

  datasource:
    url: jdbc:h2:mem:jackpot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: jackpot-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.sportsgroup.jackpot.messaging
        spring.json.value.default.type: com.sportsgroup.jackpot.messaging.BetMessage

server:
  port: 8080

logging:
  level:
    com.sportsgroup.jackpot: INFO

jackpot:
  kafka:
    # false -> bets are handed to the consumer logic in-process and the payload is logged (no broker needed).
    # true  -> a real Kafka broker is used (see docker-compose.yml).
    enabled: false
    topic: jackpot-bets

  # Every jackpot is seeded at startup with its own initial pool value, contribution
  # configuration and reward configuration. Adding a jackpot here requires no code change.
  definitions:
    - id: jackpot-fixed-1
      name: Daily Fixed Jackpot
      initial-pool-amount: 10000.00
      contribution:
        type: FIXED
        percentage: 5.00
      reward:
        type: FIXED
        chance-percentage: 10.00

    - id: jackpot-variable-1
      name: Mega Variable Jackpot
      initial-pool-amount: 50000.00
      contribution:
        # Starts at 10% of the stake and drops by 1 percentage point for every
        # 10,000 the pool grows, never going below 1%.
        type: VARIABLE
        percentage: 10.00
        min-percentage: 1.00
        decay-percentage-per-step: 1.00
        pool-step-amount: 10000.00
      reward:
        # Starts at a 1% chance and grows by 5 percentage points for every 10,000
        # the pool grows. Guaranteed win once the pool reaches 100,000.
        type: VARIABLE
        chance-percentage: 1.00
        chance-growth-percentage-per-step: 5.00
        pool-step-amount: 10000.00
        guaranteed-pool-limit: 100000.00
# @GenAI-END
